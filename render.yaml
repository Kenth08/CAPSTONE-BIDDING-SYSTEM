# Render Blueprint — the Django API only.
#
# HOW THIS PROJECT IS ACTUALLY DEPLOYED
#   Backend  → Render web service  https://capstone-bidding-system.onrender.com
#   Frontend → Vercel              https://capstone-bidding-system.vercel.app
#   Database → Supabase PostgreSQL
#
# The frontend is NOT on Render, so it is not described here — see the Vercel
# section at the bottom of this file for the variables it needs.
#
# The live backend service (named CAPSTONE-BIDDING-SYSTEM) was created by hand
# in the Render dashboard rather than from this blueprint, so editing this file
# does not change it. Env var changes must be made in the dashboard under
# Environment. This file exists so the service can be recreated from scratch,
# and as a record of what the backend needs in order to run.
#
# Values marked `sync: false` are never stored in git — fill them in via the
# Render dashboard.
services:
  - type: web
    name: capstone-bidding-system
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true        # Render generates a strong secret
      # Must be False in production: settings.py refuses to boot with the
      # insecure development SECRET_KEY fallback once DEBUG is off, and the
      # HSTS / SSL-redirect / secure-cookie hardening is gated on this.
      - key: DEBUG
        value: "False"

      # ── Supabase PostgreSQL (Session pooler values, port 5432) ────────────
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: "5432"

      # ── Blockchain ────────────────────────────────────────────────────────
      # Deployed ProcurementLedger address on Sepolia. Read by the public
      # verification endpoints so they can report which contract holds the
      # anchors. Safe to commit — a contract address is public data.
      - key: LEDGER_CONTRACT_ADDRESS
        value: "0x0c832739F61dCCb644e21799b1432842572EdcF5"
      # Read-only Sepolia RPC. Defaults to a public node when unset; set your
      # own (Alchemy / Infura) if the public one rate-limits.
      # - key: SEPOLIA_RPC_URL
      #   value: "https://ethereum-sepolia-rpc.publicnode.com"

      # ── Server-side signing: anchoring with NO MetaMask prompt ────────────
      # OFF by default, and the code path is completely inert until it is on.
      #
      # With it enabled the backend signs every anchor itself, so nobody — not
      # the Admin, not the Head, and importantly not suppliers — needs a wallet
      # or test ETH. Each transition is still anchored at the moment it happens.
      #
      # BLOCKCHAIN_PRIVATE_KEY belongs to a DEDICATED throwaway wallet holding
      # only Sepolia test ETH. Never a wallet with real funds, never in git,
      # never in a VITE_* variable (those ship to the browser in plain text).
      # `sync: false` keeps the value out of this file — set it in the dashboard.
      #
      # Trade-off to accept before enabling: every anchor is then signed by the
      # one server wallet, so the chain records THAT an event happened, not WHO
      # approved it. With MetaMask each anchor carries the acting person's
      # address. The database records the acting user either way.
      #
      # When the wallet runs out of test ETH, anchoring stops silently by
      # design (best-effort) — records stay valid and retryable. Check the
      # balance before anything that matters.
      # - key: BLOCKCHAIN_SERVER_SIGNING
      #   value: "True"
      # - key: BLOCKCHAIN_PRIVATE_KEY
      #   sync: false

      # ── Optional, NOT currently set on the live service ───────────────────
      # Each of these is safe to leave unset — the app degrades rather than
      # failing — but the feature it powers stays inactive until it is set.

      # Frontend origin. CORS already allows the Vercel domain via a regex in
      # settings.py, so login works without this; it is what password-reset and
      # email-verification links are built from.
      # - key: FRONTEND_URL
      #   value: "https://capstone-bidding-system.vercel.app"

      # SMTP. Unset = Django's console backend: password-reset and email
      # verification messages are written to the Render log and never delivered.
      # - key: EMAIL_HOST
      #   sync: false
      # - key: EMAIL_PORT
      #   value: "587"
      # - key: EMAIL_USE_TLS
      #   value: "True"
      # - key: EMAIL_HOST_USER
      #   sync: false
      # - key: EMAIL_HOST_PASSWORD
      #   sync: false
      # - key: DEFAULT_FROM_EMAIL
      #   sync: false

      # S3-compatible storage (Supabase Storage). Unset = uploads are written
      # to the container's local media/ directory, which Render's free plan
      # wipes on every deploy and restart. Set these to make uploaded
      # procurement documents SURVIVE a redeploy.
      #
      # Durability is the only thing still missing without these. Documents are
      # no longer served from MEDIA_URL (whose route only existed when DEBUG was
      # True, so every document 404'd here) — they now go through
      # /api/files/... in procurement/files.py, which works identically on local
      # disk and on S3 and enforces who may read what. So the app is correct
      # either way; unset, uploaded files simply do not survive the next deploy.
      # - key: AWS_STORAGE_BUCKET_NAME
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: AWS_S3_ENDPOINT_URL
      #   sync: false

# ── Frontend (Vercel — not managed by this file) ────────────────────────────
# Set in the Vercel dashboard under Settings → Environments → Production:
#
#   VITE_API_URL         https://capstone-bidding-system.onrender.com/api
#   VITE_LEDGER_ADDRESS  0x0c832739F61dCCb644e21799b1432842572EdcF5
#
# Vite inlines VITE_* variables at BUILD time, so changing either one requires
# a redeploy before it takes effect — saving the variable alone does nothing.
